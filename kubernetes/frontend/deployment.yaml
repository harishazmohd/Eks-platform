apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bankapp
  labels:
    app: frontend
spec:
  replicas: 2
  serviceAccountName: frontend
  automountServiceAccountToken: false
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: 020139096715.dkr.ecr.ap-south-1.amazonaws.com/eks-platform-dev-frontend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://backend.bankapp.svc.cluster.local:8080

          resources:
            requests:
              memory: "120Mi"
              cpu: "100m"
            limits:
              memory: "200Mi"
              cpu: "500m"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
