{{- if .Values.networkPolicy.enabled }}

# ---------------------------------------------------------
# Default deny
# ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bankapp.fullname" . }}-default-deny
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# ---------------------------------------------------------
# Allow DNS
# ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bankapp.fullname" . }}-allow-dns
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

---
# ---------------------------------------------------------
# Frontend ingress
#
# Allows traffic to frontend Pods on port 3000.
#
# ALB -> Frontend is intentionally allowed here because
# the AWS ALB is not a Kubernetes Pod and therefore cannot
# be selected with podSelector.
# ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bankapp.fullname" . }}-frontend
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bankapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend

  policyTypes:
    - Ingress

  ingress:
    {{- range .Values.networkPolicy.ingressCidrs }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.frontend.containerPort }}
    {{- end }}

---
# ---------------------------------------------------------
# Backend ingress
#
# Allows frontend pods to reach backend pods. Browser API
# requests are proxied through the frontend service.
# ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bankapp.fullname" . }}-backend
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bankapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend

  policyTypes:
    - Ingress

  ingress:

    # Frontend -> Backend
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "bankapp.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: frontend

      ports:
        - protocol: TCP
          port: {{ .Values.backend.containerPort }}

---
# ---------------------------------------------------------
# Backend egress
#
# Backend egress is limited to DNS and the configured RDS subnets.
# ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bankapp.fullname" . }}-backend-egress
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bankapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend

  policyTypes:
    - Egress

  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53
        
    {{- range .Values.networkPolicy.databaseCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
---
# ---------------------------------------------------------
# Frontend egress
#
# Frontend egress is limited to DNS and backend pods.
# ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bankapp.fullname" . }}-frontend-egress
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bankapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend

  policyTypes:
    - Egress

  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "bankapp.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.containerPort }}

{{- end }}
