{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bankapp.fullname" . }}-frontend
  labels:
    {{- include "bankapp.labels" . | nindent 4}}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      {{- include "bankapp.selectorLabels" . | nindent 6}}
      app.kubernetes.io/component: frontend

  template:
    metadata:
      labels:
        {{- include "bankapp.labels" . | nindent 8}}
        app.kubernetes.io/component: frontend

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: frontend
          image: "{{ required "frontend.images.repository is required" .Values.frontend.images.repository }}:{{ required "frontend.image.tag is required" .Values.frontend.images.tag }}"
          imagePullPolicy: {{ .Values.frontend.images.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
              protocol: TCP

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12}}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

{{- end }}
