{{- if .Values.backend.enabled }}

apiVersion: v1
kind: Service

metadata:
  name: {{ include "bankapp.fullname" . }}-backend

  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend

spec:
  type: {{ .Values.backend.service.type }}

  selector:
    {{- include "bankapp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backend.service.port }}
      targetPort: http

{{- end }}
