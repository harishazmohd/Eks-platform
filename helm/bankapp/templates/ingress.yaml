{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bankapp.fullname" . }}
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.host}}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
          - path: {{ .Values.ingress.backendPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bankapp.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
        paths:
          - path: {{ .Values.ingress.frontendPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bankapp.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
  {{- else }}
  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.backendPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bankapp.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: {{ .Values.ingress.frontendPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bankapp.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
  {{- end }}

{{- end }}
