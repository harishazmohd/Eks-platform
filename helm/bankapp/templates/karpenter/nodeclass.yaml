{{- if .Values.karpenter.enabled }}

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass

metadata:
  name: {{ .Values.karpenter.nodeclass.name }}
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}

spec:
  amiFamily: {{ .Values.karpenter.nodeclass.amiFamily }}
  instanceProfile: {{ .Values.karpenter.nodeclass.instanceProfile }}

  subnetSelectorTerms:
    {{- toYaml .Values.karpenter.nodeclass.subnetSelectorTerms | nindent 4 }}

  securityGroupSelectorTerms:
    {{- toYaml .Values.karpenter.nodeclass.securityGroupSelectorTerms | nindent 4 }}

  associatePublicIPAddress: false

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIpv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required

  blockDeviceMappings:
    {{- toYaml .Values.karpenter.nodeclass.blockDeviceMappings | nindent 4 }}

{{- end }}