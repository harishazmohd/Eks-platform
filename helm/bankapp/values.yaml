nameOverride: bankapp
namespace: bankapp
frontend:
  enabled: true
  replicaCount: 2
  images:
    repository: 020139096715.dkr.ecr.ap-south-1.amazonaws.com/eks-platform-dev-frontend
    tag: fb074a00886ed082e9fa916429e121a8427011bd
    pullPolicy: IfNotPresent
  containerPort: 3000
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    requests:
      cpu: 150m
      memory: 150Mi
    limits:
      cpu: 300m
      memory: 300Mi
  pdb:
    enabled: true
    minAvailable: 1
  autoScaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
      scaleDown:
        stabilizationWindowSeconds: 300


backend:
  enabled: true
  replicaCount: 2
  images:
    repository: 020139096715.dkr.ecr.ap-south-1.amazonaws.com/eks-platform-dev-backend
    tag: fb074a00886ed082e9fa916429e121a8427011bd
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 120Mi
    limits:
      cpu: 300m
      memory: 256Mi
  pdb:
    enabled: true
    minAvailable: 1
  autoScaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
      scaleDown:
        stabilizationWindowSeconds: 300

externalSecret:
  enabled: true
  name: backend-secrets
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/success-codes: 200-399
  # host: ""
  frontendPath: /
  backendPath: /api
externalSecrets:
  enabled: true
  name: backend-secrets
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  databaseSecretKey: eks-platform-dev-database
  hostProperty: host
  usernameProperty: username
  portProperty: port
  dbnameProperty: db_name
  passwordProperty: password

karpenter:
  enabled: true
  nodeclass:
    name: bankapp
    amiFamily: AL2023
    instanceProfile: eks-platform-dev-karpenter-node
    subnetSelectorTerms:
      - tags:
          karpenter.sh/discovery: eks-platform-dev-cluster
    securityGroupSelectorTerms:
      - tags:
          karpenter.sh/discovery: eks-platform-dev-cluster
    blockDeviceMappings:
      - deviceName: /dev/xvda
        ebs:
          volumeSize: 50Gi
          volumeType: gp3
          encrypted: true
          deleteOnTermination: true

  nodepool:
    name: bankapp
    workload: application
    nodeClassRef:
      group: karpenter.k8s.aws
      kind: EC2NodeClass
      name: bankapp
    requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: karpenter.k8s.aws/instance-type
          operator: In
          values:
            - c7i-flex.large
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - ap-south-1a
            - ap-south-1b
    expireAfter: 30m
    disruption:
      consolidationPolicy: WhenEmpty
      consolidateAfter: 10m
    limits:
      cpu: "8"
    weight: 10



networkPolicy:
  enabled: true
