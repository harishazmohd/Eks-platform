name: Bankapp CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read


env:
  AWS_REGION: ap-south-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python -c "
          import base64, json
          payload = '$PAYLOAD'
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print('iss =', claims.get('iss'))
          print('aud =', claims.get('aud'))
          print('sub =', claims.get('sub'))
          print('repository =', claims.get('repository'))
          print('ref =', claims.get('ref'))
          print('event_name =', claims.get('event_name'))
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: bank-app/frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: bank-app/backend
        run: npm ci

      - name: Lint frontend
        working-directory: bank-app/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: bank-app/frontend
        run: npm run build

      - name: Lint backend
        working-directory: bank-app/backend
        run: npm run lint

      - name: Build backend
        working-directory: bank-app/backend
        run: npm run build

  publish:
    name: Build and Push Images
    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR Registry
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"

      - name: Build frontend Docker image
        working-directory: bank-app/frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/eks-platform-dev-frontend:$IMAGE_TAG \
            .

      - name: Build backend Docker image
        working-directory: bank-app/backend
        run: |
          docker build \
            -t $ECR_REGISTRY/eks-platform-dev-backend:$IMAGE_TAG \
            .

      - name: Push frontend Docker image
        run: |
          docker push \
            $ECR_REGISTRY/eks-platform-dev-frontend:$IMAGE_TAG

      - name: Push backend Docker image
        run: |
          docker push \
            $ECR_REGISTRY/eks-platform-dev-backend:$IMAGE_TAG
